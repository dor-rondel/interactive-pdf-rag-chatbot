name: Assert New PR Is Valid Action

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: abc123-your-test-api-key-here

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check ESLint
        run: pnpm lint

      - name: Check Unit Tests
        run: pnpm test:unit

      - name: Prettier Styling Check
        run: pnpm format:check

      - name: Check Build
        run: pnpm build
